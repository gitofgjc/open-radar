name: Refresh GitHub radar data

on:
  schedule:
    # 00:17 UTC = 08:17 Asia/Shanghai. Scheduled runs can be delayed by GitHub.
    - cron: '17 0 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: radar-refresh
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - name: Check out source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'

      - name: Refresh the public data snapshot
        id: ingest
        continue-on-error: true
        run: python scripts/ingest_github.py --output public/data

      - name: Commit live or stale snapshot
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          if git diff --quiet -- public/data data/history; then
            echo 'No data changes to commit.'
            exit 0
          fi
          git add public/data data/history
          git commit -m "chore(data): refresh GitHub snapshot [skip ci]"
          git push
